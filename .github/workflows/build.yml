name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "لم يتم العثور على ملف ZIP لمشروع"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP" -d project

          ROOT="$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"

          if [ -z "$ROOT" ]; then
            echo "لم يتم العثور على مشروع Android داخل ZIP"
            exit 1
          fi

          ROOT="$(dirname "$ROOT")"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: raqam-saree-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error